# Run a Compose Multiplatform iOS app in an iOS Simulator on a macOS runner
# and interact with it from your browser.
# Put this file in: .github/workflows/cmp-remote.yml
# Start it from: Actions tab -> cmp-remote -> Run workflow, then open the
# trycloudflare.com URL printed in the "Open tunnel" step (also in the job summary).
name: cmp-remote
run-name: cmp-remote · ${{ inputs.minutes || '20' }}m

on:
  push:
    branches: [ main, feature/cmp-multiplatform-migration ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
  workflow_dispatch:
    inputs:
      minutes:
        description: How long to keep the session open (minutes)
        default: "20"
      xcodeproj:
        description: Path to the Xcode project
        default: iosApp/iosApp.xcodeproj
      scheme:
        description: Xcode scheme
        default: iosApp
      device:
        description: Simulator device name
        default: iPhone 17 Pro
      runner:
        description: macOS runner label (must be ARM64)
        default: macos-26
      java_version:
        description: JDK version
        default: "21"

permissions:
  contents: read

concurrency:
  group: cmp-remote-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stream:
    runs-on: ${{ inputs.runner || 'macos-26' }}
    timeout-minutes: 360
    env:
      PREVIEW_PORT: "3200"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ inputs.java_version || '21' }}

      # Caches ~/.gradle; branches other than main only read the cache
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Cache Kotlin/Native
        uses: actions/cache@v4
        with:
          path: |
            ~/.konan/dependencies
            ~/.konan/kotlin-native-prebuilt-*
          key: konan-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml') }}
          restore-keys: |
            konan-${{ runner.os }}-

      # Restored here, saved right after the build (so cancelling the
      # session later does not lose the cache)
      - name: Restore Xcode derived data
        id: derived
        uses: actions/cache/restore@v4
        with:
          path: build-ios
          key: ios-derived-${{ runner.os }}-${{ hashFiles('iosApp/**', '**/*.gradle.kts', 'gradle/libs.versions.toml') }}-${{ github.sha }}
          restore-keys: |
            ios-derived-${{ runner.os }}-${{ hashFiles('iosApp/**', '**/*.gradle.kts', 'gradle/libs.versions.toml') }}-
            ios-derived-${{ runner.os }}-

      - name: Cache cloudflared
        uses: actions/cache@v4
        with:
          path: cloudflared
          key: cmp-remote-cloudflared-darwin-arm64

      - name: Configure Gradle for CI
        run: |
          mkdir -p ~/.gradle
          {
            echo "org.gradle.caching=true"
            echo "org.gradle.parallel=true"
            echo "org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8"
            echo "kotlin.daemon.jvmargs=-Xmx3g"
          } >> ~/.gradle/gradle.properties
          chmod +x gradlew || true

      # Same keys as the Appetize workflow: one secret per key.
      - name: Create local.properties
        run: |
          {
            echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}"
            echo "SUPABASE_KEY=${{ secrets.SUPABASE_KEY }}"
            echo "SUPPORT_1=${{ secrets.SUPPORT_1 }}"
            echo "SUPPORT_5=${{ secrets.SUPPORT_5 }}"
            echo "SUPPORT_10=${{ secrets.SUPPORT_10 }}"
            echo "SUPPORT_25=${{ secrets.SUPPORT_25 }}"
            echo "SUPPORT_100=${{ secrets.SUPPORT_100 }}"
          } >> local.properties

      - name: Boot iOS Simulator
        id: sim
        timeout-minutes: 10
        run: |
          set -euo pipefail
          DEVICE='${{ inputs.device || 'iPhone 17 Pro' }}'
          UDID=$(xcrun simctl list devices available | grep -F "$DEVICE (" | head -1 \
            | sed -E 's/.*\(([0-9A-Fa-f-]{36})\).*/\1/' || true)
          if [ -z "$UDID" ]; then
            echo "::warning::'$DEVICE' not available, using the last available iPhone"
            UDID=$(xcrun simctl list devices available | grep -E '^\s+iPhone' | tail -1 \
              | sed -E 's/.*\(([0-9A-Fa-f-]{36})\).*/\1/')
          fi
          [ -n "$UDID" ] || { echo "::error::No iPhone simulator on this runner"; exit 1; }
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Build Compose Multiplatform iOS app
        timeout-minutes: 60
        run: |
          set -euo pipefail
          # The Xcode "Compile Kotlin Framework" build phase calls Gradle
          # (embedAndSignAppleFrameworkForXcode), so no separate Gradle step is needed.
          xcodebuild build \
            -project '${{ inputs.xcodeproj || 'iosApp/iosApp.xcodeproj' }}' \
            -scheme '${{ inputs.scheme || 'iosApp' }}' \
            -configuration Debug \
            -sdk iphonesimulator \
            -derivedDataPath build-ios \
            -destination "generic/platform=iOS Simulator" \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            ENABLE_PREVIEWS=NO

      - name: Save Xcode derived data
        if: success()
        uses: actions/cache/save@v4
        with:
          path: build-ios
          key: ios-derived-${{ runner.os }}-${{ hashFiles('iosApp/**', '**/*.gradle.kts', 'gradle/libs.versions.toml') }}-${{ github.sha }}

      - name: Install and launch app
        env:
          UDID: ${{ steps.sim.outputs.udid }}
        run: |
          set -euo pipefail
          APP_PATH=$(find build-ios/Build/Products/Debug-iphonesimulator -maxdepth 1 -name '*.app' -type d | head -1)
          [ -n "$APP_PATH" ] || { echo "::error::No .app found"; exit 1; }
          xcrun simctl install "$UDID" "$APP_PATH"
          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP_PATH/Info.plist")
          echo "Launching $BUNDLE_ID"
          xcrun simctl launch "$UDID" "$BUNDLE_ID"

      - name: Start serve-sim
        env:
          UDID: ${{ steps.sim.outputs.udid }}
          SERVE_SIM_AUTH_TOKEN: ${{ secrets.SERVE_SIM_AUTH_TOKEN }}
        run: |
          set -euo pipefail
          npx --yes serve-sim --detach --quiet --port "$PREVIEW_PORT" \
            --auth-token "$SERVE_SIM_AUTH_TOKEN" "$UDID" || true
          for i in $(seq 1 60); do
            nc -z 127.0.0.1 "$PREVIEW_PORT" 2>/dev/null && break
            sleep 0.5
          done
          nc -z 127.0.0.1 "$PREVIEW_PORT" || { echo "::error::serve-sim did not start"; exit 1; }
          echo "serve-sim is listening on $PREVIEW_PORT"

      - name: Open tunnel
        run: |
          set -euo pipefail
          if [ ! -f cloudflared ]; then
            curl -fsSL -o cloudflared.tgz \
              https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-darwin-arm64.tgz
            tar -xzf cloudflared.tgz && rm -f cloudflared.tgz
          fi
          chmod +x cloudflared
          # --http-host-header: serve-sim may reject the tunnel's hostname in the Host header
          nohup ./cloudflared tunnel --no-autoupdate --protocol quic \
            --http-host-header "127.0.0.1:$PREVIEW_PORT" \
            --url "http://127.0.0.1:$PREVIEW_PORT" \
            --logfile cloudflared.log > /dev/null 2>&1 &
          disown
          URL=""
          for i in $(seq 1 60); do
            URL=$(grep -Eo 'https://[a-z0-9-]+\.trycloudflare\.com' cloudflared.log 2>/dev/null | head -1 || true)
            [ -n "$URL" ] && break
            sleep 2
          done
          [ -n "$URL" ] || { echo "::error::Tunnel failed"; cat cloudflared.log; exit 1; }
          echo "=================================================="
          echo "  OPEN THIS URL:  $URL"
          echo "  Anyone with this link can control the simulator."
          echo "=================================================="
          echo "### Simulator is live: $URL" >> "$GITHUB_STEP_SUMMARY"

      - name: Hold the session open
        run: |
          echo "Session open for ${{ inputs.minutes || '20' }} minutes. Cancel the run to stop earlier."
          sleep $(( ${{ inputs.minutes || '20' }} * 60 ))