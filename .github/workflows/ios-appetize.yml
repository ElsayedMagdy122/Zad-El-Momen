name: iOS Appetize Deployment

on:
  workflow_dispatch:
  push:
    branches: [ main, develop, feature/cmp-multiplatform-migration ]

jobs:
  build-and-deploy:
    name: Build & Upload to Appetize
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Create local.properties
        run: |
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" >> local.properties
          echo "SUPABASE_KEY=${{ secrets.SUPABASE_KEY }}" >> local.properties
          echo "SUPPORT_1=${{ secrets.SUPPORT_1 }}" >> local.properties
          echo "SUPPORT_5=${{ secrets.SUPPORT_5 }}" >> local.properties
          echo "SUPPORT_10=${{ secrets.SUPPORT_10 }}" >> local.properties
          echo "SUPPORT_25=${{ secrets.SUPPORT_25 }}" >> local.properties
          echo "SUPPORT_100=${{ secrets.SUPPORT_100 }}" >> local.properties

      - name: Build iOS Simulator App
        run: |
          if [ ! -d "iosApp/iosApp.xcodeproj" ]; then
            echo "⚠️ Warning: iosApp/iosApp.xcodeproj does not exist in this project yet. Skipping iOS build step gracefully."
            exit 0
          fi
          ./gradlew clean
          
          # Detect available iPhone simulator dynamically
          DEVICE_NAME=$(xcrun simctl list devices available | grep -E 'iPhone [0-9]' | head -n 1 | sed 's/ (.*//' | xargs)
          if [ -z "$DEVICE_NAME" ]; then
            DEVICE_NAME="iPhone 16"
          fi
          echo "📱 Using simulator device: $DEVICE_NAME"

          xcodebuild clean build \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Debug \
            -sdk iphonesimulator \
            -derivedDataPath build-ios \
            -destination "platform=iOS Simulator,name=$DEVICE_NAME" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            ENABLE_PREVIEWS=NO

      - name: Zip .app bundle
        run: |
          if [ ! -d "iosApp/iosCard.xcodeproj" ] && [ ! -d "iosApp/iosApp.xcodeproj" ]; then
            exit 0
          fi
          APP_PATH=$(find build-ios/Build/Products/Debug-iphonesimulator -name "*.app" -type d -print -quit)
          if [ -z "$APP_PATH" ]; then
            echo "Error: .app bundle not found!"
            exit 1
          fi
          cd "$(dirname "$APP_PATH")"
          zip -r "$GITHUB_WORKSPACE/iosApp.zip" "$(basename "$APP_PATH")"

      - name: Upload to Appetize
        uses: appetizeio/github-action-appetize@v1.0.5
        with:
          apiToken: ${{ secrets.APPETIZE_API_TOKEN }}
          appFile: iosApp.zip
          platform: ios

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-app-simulator
          path: iosApp.zip
          retention-days: 5
