name: Build iOS for Appetize

on:
  workflow_dispatch:
  push:

jobs:
  build-ios:
    runs-on: macos-latest
    timeout-minutes: 40

    # Global environment variables for the entire job
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      SUPPORT_1: ${{ secrets.SUPPORT_1 }}
      SUPPORT_5: ${{ secrets.SUPPORT_5 }}
      SUPPORT_10: ${{ secrets.SUPPORT_10 }}
      SUPPORT_25: ${{ secrets.SUPPORT_25 }}
      SUPPORT_100: ${{ secrets.SUPPORT_100 }}
      GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      # Cache Kotlin/Native toolchain (~/.konan) to avoid heavy downloading on every run
      - name: Cache Kotlin Native Toolchain
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: ${{ runner.os }}-konan-${{ hashFiles('**/gradle/libs.versions.toml', '**/*.gradle.kts') }}
          restore-keys: |
            ${{ runner.os }}-konan-

      - name: Decode Google Services JSON
        if: env.GOOGLE_SERVICES_JSON_BASE64 != ''
        run: |
          mkdir -p app
          echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > app/google-services.json

      - name: Create dummy GoogleService-Info.plist
        run: |
          mkdir -p iosApp/iosApp
          echo '<?xml version="1.0" encoding="UTF-8"?><!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd"><plist version="1.0"><dict><key>BUNDLE_ID</key><string>dev.sayed.mehrabalmomen.ios</string></dict></plist>' > iosApp/iosApp/GoogleService-Info.plist

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build with Xcode
        run: |
          xcodebuild clean build \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Debug \
            -sdk iphonesimulator \
            -derivedDataPath build-ios \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            ENABLE_PREVIEWS=NO

      - name: Zip .app bundle
        run: |
          APP_PATH=$(find build-ios/Build/Products/Debug-iphonesimulator -name "*.app" -type d -print -quit)
          [ -z "$APP_PATH" ] && { echo "Error: .app bundle not found!"; exit 1; }
          (cd "$(dirname "$APP_PATH")" && zip -r "$GITHUB_WORKSPACE/iosApp.zip" "$(basename "$APP_PATH")")

      - name: Upload to Appetize
        uses: appetizeio/github-action-appetize@v1.0.5
        with:
          apiToken: ${{ secrets.APPETIZE_API_TOKEN }}
          appFile: iosApp.zip
          platform: ios

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-app-simulator
          path: iosApp.zip
          retention-days: 5