name: Build iOS for Appetize

on:
  workflow_dispatch:
  push:
    branches: [ main, develop, refactor/kmp-migration ]
    paths:
      - 'iosApp/**'
      - 'shared/**'
      - 'designsystem/**'
      - 'data/**'
      - 'domain/**'
      - 'presentation/**'
  pull_request:
    branches: [ main, develop, master ]

jobs:
  build-ios:
    name: Build iOS App Simulator & Upload
    runs-on: macos-14
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build iOS Simulator App
        run: |
          ./gradlew clean
          xcodebuild clean build \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Debug \
            -sdk iphonesimulator \
            -derivedDataPath build-ios \
            -destination 'platform=iOS Simulator,name=iPhone 15,OS=latest' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            ENABLE_PREVIEWS=NO

      - name: Zip .app bundle
        run: |
          APP_PATH=$(find build-ios/Build/Products/Debug-iphonesimulator -name "*.app" -type d -print -quit)
          if [ -z "$APP_PATH" ]; then
            echo "Error: .app bundle not found!"
            exit 1
          fi
          cd "$(dirname "$APP_PATH")"
          zip -r "$GITHUB_WORKSPACE/iosApp.zip" "$(basename "$APP_PATH")"

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-app-simulator
          path: iosApp.zip
          retention-days: 5

      - name: Upload App to Appetize.io
        if: ${{ secrets.APPETIZE_API_TOKEN != '' }}
        env:
          APPETIZE_API_TOKEN: ${{ secrets.APPETIZE_API_TOKEN }}
          APPETIZE_PUBLIC_KEY: ${{ secrets.APPETIZE_PUBLIC_KEY }}
        run: |
          if [ -n "$APPETIZE_PUBLIC_KEY" ]; then
            curl --location --request POST "https://api.appetize.io/v1/apps/${APPETIZE_PUBLIC_KEY}" \
              --header "Authorization: Bearer ${APPETIZE_API_TOKEN}" \
              --form "file=@iosApp.zip" \
              --form "platform=ios"
          else
            curl --location --request POST "https://api.appetize.io/v1/apps" \
              --header "Authorization: Bearer ${APPETIZE_API_TOKEN}" \
              --form "file=@iosApp.zip" \
              --form "platform=ios"
          fi
