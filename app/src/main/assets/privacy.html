<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

    <style>
        :root {
            /* قيم افتراضية يتم استبدالها تلقائياً من كود الأندرويد */
            --bg: #F2F4F7;
            --title: #3E4252;
            --text: #818599;
            --primary: #111D2E;
            --title-size: 16px; /* القيمة الافتراضية لـ title.small */
            --body-size: 12px;  /* القيمة الافتراضية لـ body.medium */
        }

        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            padding: 0 24px 24px 24px;
            direction: ltr;
        }

        body.rtl {
            direction: rtl;
        }

        /* TYPOGRAPHY */
        h2 {
            font-size: var(--title-size);
            font-weight: 700;
            color: var(--title);
            margin: 24px 0 12px 0;
        }

        h3 {
            /* يتم حساب مقاس العناوين الفرعية لتكون متناسقة تلقائياً مع العنوان الرئيسي */
            font-size: calc(var(--title-size) - 2px);
            font-weight: 600;
            color: var(--title);
            margin: 16px 0 8px 0;
        }

        p, li {
            font-size: var(--body-size);
            line-height: 1.6;
            color: var(--text);
            margin: 0 0 10px 0;
        }

        ul {
            margin: 0 0 16px 0;
            padding-left: 20px;
            padding-right: 20px;
        }
    </style>
</head>
<body>
